[project]
name = "mule"
version = "0.1.0"
description = "A Python compiler with an LLVM backend"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
mule = "mule.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14",
]

[tool.uv.build-backend]
module-name = "mule"
module-root = ""

[tool.pytest.ini_options]
addopts = "-n 6"
testpaths = ["test"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"

[tool.ty.src]
# Not ordinary Python to type-check: the vendored CPython standard library and
# Mule's compiler-bound protocol modules, programs that exercise runtime errors
# on purpose, third-party benchmark programs, and the retired bootstrap.
exclude = ["stdlib", "conformance", "examples", "old"]

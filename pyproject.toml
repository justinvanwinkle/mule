[project]
name = "mule"
version = "0.1.0"
description = "A Python compiler with an LLVM backend"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
mule = "mule.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14",
]

[tool.uv.build-backend]
module-name = "mule"
module-root = ""

[tool.pytest.ini_options]
# Integration suites build hundreds of programs or run whole external test
# suites; run them explicitly with `uv run pytest -m integration`.
addopts = "-n 6 -m 'not integration'"
markers = [
    "integration: builds many programs or runs whole external suites",
]
testpaths = ["test"]
pythonpath = [".", "perf/suite"]

[tool.mule]
# Loaded by pytest from a path selected at runtime.
include_modules = [
    "test.conftest",
    "test.corpus.*",
    "test.conformance.*",
    "test.mule.compiler.*",
    "test.mule.parser.*",
    "test.perf.*",
    "test.stdlib.*",
    "integer_accumulation",
    "graph_paths",
    "log_aggregation",
    "http_routing",
    "xdist.plugin",
    "xdist.looponfail",
]

[tool.ruff]
target-version = "py314"
# Conformance and corpus programs exercise unusual Python on purpose.
extend-exclude = ["old", "examples", "conformance", "corpus"]
force-exclude = true

[tool.ruff.lint]
# dict(a=1) and list() read as clearly as their literals.
ignore = ["C408"]

[tool.ty.src]
# Not ordinary Python to type-check: the vendored CPython standard library and
# Mule's compiler-bound protocol modules, programs that exercise runtime errors
# on purpose, third-party and corpus benchmark programs, and the retired
# bootstrap.
exclude = ["stdlib", "conformance", "examples", "corpus", "old"]

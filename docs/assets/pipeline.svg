<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 218" role="img" aria-labelledby="title description">
  <title id="title">Mule's native compilation pipeline</title>
  <desc id="description">Python source passes through a handwritten parser and Mule AST, IR1 analysis and optimization, IR2 representation selection, and LLVM to become a native executable.</desc>
  <rect width="1120" height="218" rx="12" fill="#faf8f3"/>
  <g font-family="system-ui, sans-serif" fill="#242b29">
    <text x="28" y="38" font-size="12" font-weight="700" letter-spacing="2" fill="#a4432d">THE COMPILER</text>
    <text x="28" y="70" font-size="25" font-weight="650">From Python source to a native executable.</text>
    <g fill="#fffefa" stroke="#d9d8cd">
      <rect x="28" y="98" width="190" height="88" rx="5"/>
      <rect x="246" y="98" width="190" height="88" rx="5"/>
      <rect x="464" y="98" width="190" height="88" rx="5"/>
      <rect x="682" y="98" width="190" height="88" rx="5"/>
      <rect x="900" y="98" width="190" height="88" rx="5" fill="#242b29" stroke="#242b29"/>
    </g>
    <path d="M224 142h16m-5-5 5 5-5 5 M442 142h16m-5-5 5 5-5 5 M660 142h16m-5-5 5 5-5 5 M878 142h16m-5-5 5 5-5 5" fill="none" stroke="#a4432d" stroke-width="1.5"/>
    <g font-size="20" font-weight="650">
      <text x="44" y="130">Python</text>
      <text x="262" y="130">Mule AST</text>
      <text x="480" y="130">IR1</text>
      <text x="698" y="130">IR2</text>
      <text x="916" y="130" fill="#faf8f3">LLVM → native</text>
    </g>
    <g font-size="14" fill="#626a64">
      <text x="44" y="163">Supported source</text>
      <text x="262" y="163">Handwritten parser</text>
      <text x="480" y="163">Analyze &amp; optimize</text>
      <text x="698" y="163">Select representations</text>
      <text x="916" y="163" fill="#d9d8cd">Independent executable</text>
    </g>
  </g>
</svg>
